[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldmate"
version = "0.2.0"
description = "An offline voice fieldbook, grounded in your own documents."
requires-python = ">=3.12,<3.14"
dependencies = [
  "ddgs>=9,<10",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7",
  "faster-whisper>=1.1,<2", "piper-tts>=1.3,<2",
  # PyAV 19 removes metadata_errors, still used by faster-whisper's decoder.
  "av>=15,<17",
]

[project.optional-dependencies]
decision = ["laya>=0.3.23,<0.4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fieldmate = "fieldmate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["fieldmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = [".runtime", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fieldmate"]
